    <!-- viewport-fit=cover lets the app draw under the notch / home-indicator
         (and is what actually makes every env(safe-area-inset-*) non-zero on
         iOS in standalone mode). User zoom stays enabled for WCAG AA. -->

    <title>Endstep: a fast browser client for constructed, cube draft, sealed, and multiplayer pods</title>

    <!-- Share-embed + SEO metadata. Endstep is a client-rendered SPA, so the
         link-preview bots (WhatsApp, Discord, iMessage, Slack, Facebook,
         Twitter) — which do NOT run JS — see only this static <head>. These
         tags are what they unfurl. Copy stays trademark-light on purpose: the
         footer carries the one WotC Fan Content Policy reference; naming the
         mark in indexable, keyword-targeting metadata is a riskier use.

         Trademark-light is NOT a licence to be vague, and conflating the two
         cost us players. A tester trying to recruit in Discord LFG channels
         reported the unfurl "does come off as ever so slightly crypto scam-y",
         and the old copy earned it: a bare coined word as the headline, then
         two content-free adjectives ("fast, modern") in front of an abstract
         category ("online table for competitive trading-card-game play"). That
         last phrase is visibly a euphemism, and an evasive description beside
         a gold-on-black sigil reads as concealment rather than caution.

         The fix is specificity, not the mark: concrete verbs, real nouns, no
         hype adjectives, and details a scam would not bother inventing (the
         rules engine, the pod size, free with nothing to install). pages/
         formats.html was already the proof that this works — it names Momir
         Basic, Winston, Richman and Forgetful Fish outright and reads like a
         real product.

         The title carries no category noun at all, and that is deliberate: two
         drafts of it failed the same way. "competitive card games" (plural)
         claims a multi-TCG platform we are not, and a generic platform is
         precisely the shapeless thing that read as a scam. "the competitive
         card game" (singular) fixes the accuracy and replaces the euphemism
         with a WINK — it asserts you know which one — and a wink has the same
         tell as an evasion. Naming the formats instead sidesteps both: it says
         what you can actually do here, in the words players use. Keep new copy
         concrete; do not reach for another euphemism, and do not reach for a
         knowing one either.
         Fenced by web/src/tests/seo-meta.test.ts. -->
    <meta
      name="description"
      content="Draft a cube, build a deck, play a pod. A full rules engine runs every match: the stack, triggers, priority. Nothing to install, and matches start in seconds. Plus formats you won't find elsewhere: Winston, Richman, Momir Basic, Forgetful Fish."
    />
    <link rel="canonical" href="https://endstep.cc/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Endstep" />
    <meta
      property="og:title"
      content="Endstep: a fast browser client for constructed, cube draft, sealed, and multiplayer pods"

    <meta

        "@context": "https://schema.org",

        "description": "Draft a cube, build a deck, play a pod. A full rules engine runs every match: the stack, triggers, priority. Nothing to install, and matches start in seconds. Plus formats you won't find elsewhere: Winston, Richman, Momir Basic, Forgetful Fish."

    <!-- Card art lives on the Scryfall CDN, but every <img> asks our own origin
         first (/api/cards/image 302s to it), so the browser cannot discover the
         host from the markup — it learns of it only when the first redirect
         lands, and pays DNS + TLS before a single card byte arrives. Warming
         the connection here spends that cost during boot instead.
         Deliberately WITHOUT crossorigin: card <img> tags are not CORS
         requests, and a crossorigin preconnect would warm the wrong socket
         pool (unlike the gstatic hint below, where the font fetch IS CORS). -->
    <link rel="preconnect" href="https://cards.scryfall.io" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
